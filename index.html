<!doctype html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle Mensal</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#16302E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<style>
:root{--fundo:#EDF1EE;--papel:#FAFBF9;--tinta:#16302E;--suave:#55696A;--linha:#CBD5D0;--receita:#1D6FA8;--gasto:#C2571A;--alerta:#A3261C;--campo:#FFF;--pago:#1B7A4B;--fixo:#1D6FA8;--variavel:#C2571A;--eventual:#7A4FA3}
@media (prefers-color-scheme:dark){:root{--fundo:#122120;--papel:#1A2C2B;--tinta:#E8EFEB;--suave:#A0B2AF;--linha:#35494A;--receita:#4F9BD1;--gasto:#D9763A;--alerta:#F0897F;--campo:#122120;--pago:#62D29A;--fixo:#4F9BD1;--variavel:#D9763A;--eventual:#9A78CC}}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:92px}
main{max-width:560px;margin:0 auto;padding:12px 16px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--receita);outline-offset:2px}
.topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.topo h1{font-size:1.15rem;margin:0}
.seta{width:44px;height:44px;border-radius:50%;border:1px solid var(--linha);background:none;font-size:1.3rem}
.placar{display:grid;grid-template-columns:1fr 1fr;background:var(--papel);border-radius:6px}
.kpi{padding:12px 14px;min-width:0}
.kpi:nth-child(even){border-left:1px solid var(--linha)}
.kpi:nth-child(n+3){border-top:1px solid var(--linha)}
.kpi h2{font-size:.82rem;font-weight:500;color:var(--suave);margin:0 0 2px}
.kpi b{font-size:1.2rem;white-space:nowrap}
.kpi small{display:block;color:var(--suave);font-size:.78rem}
.marca{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.neg{color:var(--alerta)}
.alerta{background:var(--papel);border-left:4px solid var(--alerta);padding:8px 12px;margin:12px 0 0;font-size:.92rem}
.erro{background:var(--papel);border-left:4px solid var(--alerta);padding:10px 12px;margin:12px 0}
section{background:var(--papel);border-radius:6px;padding:12px 14px;margin-top:12px}
h3{font-size:1rem;margin:0 0 6px}
.lin{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.lin b{font-weight:600;white-space:nowrap}
.cat{margin-bottom:8px;font-size:.92rem}
.trilho{height:6px;background:var(--fundo);border-radius:3px;margin-top:3px}.trilho i{display:block;height:100%;background:var(--gasto);border-radius:3px}
.item{padding:10px 0;border-bottom:1px solid var(--linha)}.item:last-child{border-bottom:0}
.item .sub{font-size:.82rem;color:var(--suave)}
.item .acoes{display:flex;gap:18px;margin-top:4px}
.item .acoes button{background:none;border:0;padding:6px 0;text-decoration:underline;font-size:.88rem;color:var(--suave)}
.item .acoes .forte{color:var(--tinta);font-weight:600}
.vazio{color:var(--suave);margin:4px 0}
.novo{position:fixed;left:16px;right:16px;bottom:16px;max-width:528px;margin:0 auto;padding:15px;border:0;border-radius:8px;background:var(--tinta);color:var(--papel);font-weight:600;font-size:1.05rem}
dialog{border:0;border-radius:10px;padding:16px;width:calc(100% - 24px);max-width:520px;background:var(--papel);color:var(--tinta)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select{width:100%;padding:12px;font:inherit;font-size:16px;border:1px solid var(--linha);border-radius:6px;background:var(--campo);color:var(--tinta)}
.duplo{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opcao{padding:12px;border:1px solid var(--linha);background:var(--campo);border-radius:6px;font-weight:500}
.opcao[aria-pressed=true]{background:var(--tinta);color:var(--papel);border-color:var(--tinta);font-weight:600}
.fim{display:flex;gap:10px;margin-top:16px}
.salvar{flex:1;padding:14px;border:0;border-radius:6px;background:var(--tinta);color:var(--papel);font-weight:600}
.cancelar{padding:14px;border:1px solid var(--linha);border-radius:6px;background:none}
.carregando{opacity:.55;pointer-events:none}
#areaBusca{max-width:560px;margin:0 auto;padding:12px 16px 0}
#formBusca{display:flex;gap:8px}#formBusca input{flex:1;min-width:0}#formBusca .salvar{flex:none;padding:0 16px}
#resultados{margin-top:10px}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.previa{font-size:.88rem;color:var(--suave);margin:6px 0 0;font-weight:500}
.pilhaBotoes{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.perigo{padding:13px;border:1px solid var(--alerta);border-radius:6px;background:none;color:var(--alerta);font-weight:600}
.linkbtn{background:none;border:0;padding:4px 0;text-decoration:underline;color:inherit;font-size:inherit}
.conta{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;color:var(--suave);margin:0 0 8px}
@media (min-width:860px){#areaBusca,main{max-width:1000px}.placar{grid-template-columns:repeat(4,1fr)}.kpi:nth-child(n+3){border-top:0}.kpi:nth-child(3){border-left:1px solid var(--linha)}#tela{padding-bottom:20px}.colunas{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}.novo{left:auto;right:calc(50% - 484px);width:260px;margin:0}}
.ok{color:var(--pago);font-weight:600}
.cabeca{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--linha)}
.cabeca h3{margin:0}.cabeca b{white-space:nowrap}
.grupo.pagas{border-left:4px solid var(--pago)}
.grupo.pagas .cabeca h3,.grupo.pagas .cabeca b{color:var(--pago)}
.item.feito .lin b{color:var(--pago)}
#status{font-size:.88rem;margin:8px 0 0}#status.salvando{color:var(--suave)}
.item[data-id]{cursor:pointer}
.item[data-id]:hover{background:var(--fundo)}
.clip{color:var(--tinta);font-weight:500}
#janelaDetalhe{max-height:90vh;overflow:auto}
.deValor{font-size:1.3rem;font-weight:700;margin:0}
.blocoAnexo{border-top:1px solid var(--linha);margin-top:12px;padding-top:10px}
.blocoAnexo .topoAnexo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.blocoAnexo h4{margin:0;font-size:.95rem}
.botaoAnexo{padding:9px 12px;border:1px solid var(--linha);border-radius:6px;background:var(--campo);font-weight:600;font-size:.88rem}
.linhaAnexo{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;font-size:.92rem}
.linhaAnexo span{overflow-wrap:anywhere;min-width:0}
.linhaAnexo div{display:flex;gap:14px;flex:none}
#visor{margin-top:12px;border-top:1px solid var(--linha);padding-top:10px}
#visor img{display:block;max-width:100%;height:auto;border-radius:4px}
#visor iframe{width:100%;height:60vh;border:1px solid var(--linha);border-radius:4px;background:#fff}
.visorAcoes{display:flex;gap:18px;margin-bottom:8px;font-size:.92rem}
@media (min-width:860px){#janelaDetalhe{max-width:760px}}
.caixa .lin{border-bottom:1px solid var(--linha)}.caixa .lin.total{font-weight:600;border-bottom:0}
.azul{color:var(--receita)}
.caixa .previsto{font-size:1.1rem;padding-top:8px}
.atrasadasPagas{margin-top:6px;font-size:.9rem}.atrasadasPagas summary{cursor:pointer;color:var(--suave);padding:4px 0}
.btnRel{padding:6px 14px;border:1px solid var(--tinta);border-radius:999px;background:var(--tinta);color:var(--papel);font-weight:600;font-size:.85rem}
.rl-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.rl-topo select{width:auto;padding:8px 10px}
.rl-h1{font-size:1.35rem;margin:4px 0}.rl-h2{font-size:1.1rem;margin:0 0 6px}
.rl-frase{font-size:1.12rem;line-height:1.45;margin:10px 0 4px}.rl-frase b{white-space:nowrap}
.rl-pos{color:var(--pago)}
.rl-kpis{display:grid;grid-template-columns:1fr 1fr;background:var(--papel);border-radius:6px;margin-top:12px}
.rl-kpi{padding:12px 14px;min-width:0;border-top:1px solid var(--linha)}.rl-kpi:nth-child(-n+2){border-top:0}.rl-kpi:nth-child(even){border-left:1px solid var(--linha)}
.rl-kpi span{display:block;font-size:.82rem;color:var(--suave)}.rl-kpi b{display:block;font-size:1.15rem;white-space:nowrap}.rl-kpi small{display:block;font-size:.78rem;color:var(--suave)}
.rl-marca{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.rl-f{background:var(--fixo)}.rl-v{background:var(--variavel)}.rl-e{background:var(--eventual)}
.rl-cartoes{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
.rl-cartao{border:1px solid var(--linha);border-radius:6px;padding:10px 12px}.rl-cartao span{display:block;font-size:.82rem;color:var(--suave)}.rl-cartao b{display:block;font-size:1.15rem}
.rl-barra{position:relative;display:flex;gap:2px;height:20px;margin:24px 0 6px}.rl-barra>i{display:block;height:100%}
.rl-ess{background:var(--tinta);border-radius:4px 0 0 4px}.rl-varb{border-radius:0 4px 4px 0}
.rl-linha{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--pago)}
.rl-linha em{position:absolute;top:-20px;left:4px;font-size:.75rem;font-style:normal;color:var(--suave);white-space:nowrap}.rl-linha.rl-fim em{left:auto;right:4px}
.rl-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--suave);margin:6px 0}
.rl-listas{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.rl-grupo{margin-bottom:12px}.rl-tit{display:flex;justify-content:space-between;font-weight:600;border-bottom:1px solid var(--linha);padding-bottom:3px;margin-bottom:3px}
.rl-it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:5px 4px;border-radius:4px;cursor:pointer;font-size:.9rem}
.rl-it:hover,.rl-it:focus-visible{background:var(--fundo)}.rl-it small{color:var(--suave)}
.rl-val{text-align:right;white-space:nowrap;font-weight:500}
.rl-tr{grid-column:1/-1;height:6px;background:var(--fundo);border-radius:3px}.rl-tr i{display:block;height:100%;border-radius:3px}
.rl-it.rl-sel{background:color-mix(in srgb,var(--fixo) 26%,transparent);box-shadow:inset 3px 0 0 var(--fixo)}.rl-sel .rl-nome::before{content:'✓ ';color:var(--fixo);font-weight:700}
.rl-soma{position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;background:var(--tinta);color:var(--papel);box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:5}
.rl-soma span{flex:1;font-size:.9rem}.rl-soma b{font-size:1.15rem;white-space:nowrap}.rl-soma button{background:none;border:1px solid currentColor;border-radius:6px;padding:6px 10px;color:inherit}
.rl-usar{display:flex;gap:8px;align-items:center;font-weight:500;margin:10px 0 0}.rl-usar input{width:18px;height:18px;padding:0}
.rl-pend{font-size:.75rem;color:var(--variavel);font-weight:600;margin-left:6px}
.rl-sim{display:grid;grid-template-columns:1fr;gap:4px;margin-top:10px}.rl-sim label{margin:6px 0 0;font-weight:500}.rl-sim input{padding:0}
.rl-cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(44px,1fr);gap:4px;overflow-x:auto;padding-top:6px}
.rl-col{display:flex;flex-direction:column;align-items:center;border:0;background:none;border-radius:4px;padding:4px 0}
.rl-col:hover{background:var(--fundo)}.rl-col.rl-ativa{background:var(--fundo);outline:2px solid var(--tinta)}
.rl-area{position:relative;height:140px;width:100%;display:flex;justify-content:center;align-items:flex-end;border-bottom:1px solid var(--linha)}
.rl-pilha{width:min(22px,60%);display:flex;flex-direction:column-reverse;gap:2px;height:100%}.rl-pilha i{display:block}.rl-pilha i:last-child{border-radius:4px 4px 0 0}
.rl-rec{position:absolute;left:12%;right:12%;height:2px;background:var(--pago)}
.rl-col small{font-size:.72rem;color:var(--suave);margin-top:4px;line-height:1.2}.rl-col.rl-ativa small{color:var(--tinta);font-weight:600}
.rl-rol{overflow-x:auto}.rl-tab{width:100%;border-collapse:collapse;font-size:.88rem}
.rl-tab th,.rl-tab td{text-align:left;padding:6px;border-bottom:1px solid var(--linha);vertical-align:top}.rl-tab th{color:var(--suave);font-weight:600;font-size:.8rem}
.rl-tab .n{text-align:right;white-space:nowrap}
.rl-dl{font-size:.9rem;margin:8px 0 0}.rl-dl dt{font-weight:600;margin-top:8px}.rl-dl dd{margin:2px 0 0;color:var(--suave)}
#relatorio{padding-bottom:90px}
.rl-tocar{cursor:pointer;border-radius:4px}.rl-tocar:hover,.rl-tocar:focus-visible{background:var(--fundo)}
.rl-listas h3.rl-tocar::after{content:' (toque para selecionar todas)';font-weight:400;font-size:.8rem;color:var(--suave)}
@media (min-width:860px){#relatorio{max-width:1000px}.rl-kpis{grid-template-columns:repeat(6,1fr)}.rl-kpi{border-top:0!important;border-left:1px solid var(--linha)}.rl-kpi:first-child{border-left:0}.rl-cartoes{grid-template-columns:repeat(3,1fr)}.rl-listas{grid-template-columns:1fr 1fr;gap:24px}.rl-sim{grid-template-columns:1fr 1fr;align-items:center}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="entrada" hidden>
  <h1 style="font-size:1.5rem;margin:10vh 0 12px">Controle Mensal</h1>
  <form id="formEntrar" novalidate>
    <div id="caixaServidor">
      <label for="servidor">Endereço do servidor</label>
      <input id="servidor" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <label for="usuario">Usuário</label>
    <input id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <p class="erro" id="erroSenha" role="alert" hidden></p>
    <button class="salvar" id="entrar" style="width:100%;margin-top:14px">Entrar</button>
  </form>
</main>
<div id="areaBusca" hidden>
  <form id="formBusca" role="search" novalidate>
    <label for="termo" class="oculto">Pesquisar contas lançadas</label>
    <input id="termo" type="search" placeholder="Pesquisar contas lançadas" autocomplete="off" enterkeyhint="search">
    <button class="salvar" id="botaoBusca">Pesquisar</button>
  </form>
  <p id="status" role="status" hidden></p>
  <section id="resultados" hidden></section>
</div>
<main id="tela"></main>
<main id="relatorio" hidden></main>
<button class="novo" id="abrir" hidden>Novo lançamento</button>
<dialog id="janela">
  <form id="form" method="dialog" novalidate>
    <h3>Novo lançamento</h3>
    <div class="duplo" role="group" aria-label="Tipo">
      <button type="button" class="opcao" data-tipo="Despesa" aria-pressed="true">Gasto</button>
      <button type="button" class="opcao" data-tipo="Receita" aria-pressed="false">Receita</button>
    </div>
    <label for="valor">Valor</label>
    <input id="valor" inputmode="decimal" autocomplete="off" placeholder="0,00">
    <label for="descricao">Descrição</label>
    <input id="descricao" autocomplete="off" maxlength="120" placeholder="Mercado, luz, salário">
    <label for="data">Data</label>
    <input id="data" type="date">
    <label for="situacao">Situação</label>
    <select id="situacao"><option value="feito">Pago</option><option value="pendente">A pagar</option></select>
    <label for="repetir">Repetição</label>
    <select id="repetir"><option value="nao">Só esta vez</option><option value="parcelado">Parcelado</option><option value="mensal">Todo mês, por 12 meses</option></select>
    <div id="caixaParcelas" hidden>
      <label for="parcelas">Número de parcelas</label>
      <input id="parcelas" inputmode="numeric" value="2">
      <label for="valorModo">O valor digitado é</label>
      <select id="valorModo"><option value="parcela">De cada parcela</option><option value="total">O total da compra</option></select>
      <p class="previa" id="previa" role="status"></p>
    </div>
    <p class="erro" id="erroForm" role="alert" hidden></p>
    <div class="fim"><button type="button" class="cancelar" id="cancelar">Cancelar</button><button type="button" class="salvar" id="salvar">Salvar</button></div>
  </form>
</dialog>
<dialog id="janelaEditar">
  <form novalidate>
    <h3>Editar lançamento</h3>
    <div id="caixaEscopo">
      <label for="edEscopo">O que alterar</label>
      <select id="edEscopo"></select>
      <p class="previa" id="edAviso"></p>
    </div>
    <label for="edValor" id="edRotuloValor">Valor</label>
    <input id="edValor" inputmode="decimal" autocomplete="off">
    <label for="edDescricao">Descrição</label>
    <input id="edDescricao" autocomplete="off" maxlength="120">
    <label for="edData">Data</label>
    <input id="edData" type="date">
    <div id="caixaEdSituacao">
      <label for="edSituacao">Situação</label>
      <select id="edSituacao"></select>
    </div>
    <div id="caixaEdPago">
      <label for="edPagoEm" id="edRotuloPago">Data do pagamento</label>
      <input id="edPagoEm" type="date">
      <p class="previa">Define em qual mês o valor entra no Caixa do mês.</p>
    </div>
    <p class="erro" id="erroEditar" role="alert" hidden></p>
    <div class="fim"><button type="button" class="cancelar" id="edCancelar">Cancelar</button><button type="button" class="salvar" id="edSalvar">Salvar alterações</button></div>
  </form>
</dialog>
<dialog id="janelaDetalhe" aria-labelledby="deTitulo">
  <h3 id="deTitulo"></h3>
  <p class="deValor" id="deValor"></p>
  <p class="sub" id="deInfo"></p>
  <div id="deBoletos"></div>
  <div id="deComprovantes"></div>
  <p class="erro" id="erroAnexo" role="alert" hidden></p>
  <p class="previa" id="progressoAnexo" role="status" hidden></p>
  <div id="visor" hidden></div>
  <input id="arquivoAnexo" type="file" accept="image/*,application/pdf" class="oculto" tabindex="-1" aria-hidden="true">
  <div class="fim"><button type="button" class="cancelar" id="deFechar" style="flex:1">Fechar</button></div>
</dialog>
<dialog id="janelaExcluir">
  <h3 id="exTitulo"></h3>
  <p id="exTexto"></p>
  <div class="pilhaBotoes">
    <button type="button" class="perigo" id="exUma"></button>
    <button type="button" class="perigo" id="exTodas"></button>
    <button type="button" class="cancelar" id="exCancelar">Cancelar</button>
  </div>
</dialog>
<script>
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var $=function(i){return document.getElementById(i)},tipo='Despesa';
var base={itens:[]},mesAtivo='',temDados=false,fila=[],enviando=false,ultimaAtualizacao=0,revisao=0,avisoStatus='',temporizador=null;
var sessao={servidor:'',token:'',usuario:''};
var RE_SERVIDOR=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
var SEM_NOVA='Publique a nova versão do script no Google para concluir a atualização.';
var AVISOS={LOGIN_INCORRETO:'Usuário ou senha incorretos.',LOGIN_BLOQUEADO:'Muitas tentativas erradas. Aguarde 15 minutos.',LOGIN_SEM_SENHA:'Defina a senha desse usuário no script do servidor e publique uma nova versão.',LOGIN_EXPIRADO:'Sua sessão terminou. Entre de novo.'};
function ler(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function gravar(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k)}catch(e){}}
function real(c){var n=Math.abs(c),s=Math.floor(n/100).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (c<0?'-':'')+'R$ '+s+','+('0'+(n%100)).slice(-2)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nomeMes(m){return MESES[+m.slice(5,7)-1]+' de '+m.slice(0,4)}
function ddmm(d){return d.slice(8,10)+'/'+d.slice(5,7)}
function outroMes(m,n){var a=+m.slice(0,4),x=+m.slice(5,7)-1+n;a+=Math.floor(x/12);x=((x%12)+12)%12;return a+'-'+('0'+(x+1)).slice(-2)}
function hoje(){var d=new Date(Date.now()-3*3600000);return d.toISOString().slice(0,10)}
function agora(){return new Date(Date.now()-3*3600000).toISOString().slice(0,23)+'-03:00'}
function somarMeses(iso,n,dia){var a=+iso.slice(0,4),m=+iso.slice(5,7)-1+n;a+=Math.floor(m/12);m=((m%12)+12)%12;var u=new Date(Date.UTC(a,m+1,0)).getUTCDate();return a+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+Math.min(dia,u)).slice(-2)}
function mesesEntre(de,ate){return (+ate.slice(0,4)-+de.slice(0,4))*12+(+ate.slice(5,7)-+de.slice(5,7))}
function normalizar(t){return String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function centavos(t){t=String(t).replace(/[^\d.,]/g,'');if(!t)return 0;var m=t.match(/[.,](\d{1,2})$/),i=t,d='';if(m){i=t.slice(0,m.index);d=m[1]}return parseInt(i.replace(/[.,]/g,'')||'0',10)*100+parseInt((d+'00').slice(0,2),10)}
function novoId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function porData(a,b){return a.data<b.data?-1:a.data>b.data?1:String(a.descricao).localeCompare(String(b.descricao))}
function guardarLocal(){gravar('cm_cache',JSON.stringify({itens:base.itens}));gravar('cm_fila',JSON.stringify(fila))}
function contarSeries(){var q={};base.itens.forEach(function(i){if(i.serie)q[i.serie]=(q[i.serie]||0)+1});base.itens.forEach(function(i){i.qtdSerie=i.serie?q[i.serie]:1})}

// credentials omit: a página nunca envia cookies do Google, então as contas do navegador não interferem.
function enviar(corpo){return fetch(sessao.servidor,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(corpo)}).then(function(r){if(!r.ok)throw new Error('HTTP');return r.json()})}

function resumo(mes){
  var hj=hoje(),limite=mes>hj.slice(0,7)?mes:hj.slice(0,7),ant=outroMes(mes,-1);
  var d={mes:mes,hoje:hj,r:{recebido:0,a_receber:0,pago:0,a_pagar:0},anterior:{receitas:0,despesas:0},itens:[],vencidas:0,vencidasValor:0,vencimentos:[]},cats={},fut={},lim=somarDias(hj,30);
  base.itens.forEach(function(i){
    if(i.mes===mes){d.itens.push(i);if(i.tipo==='Receita')d.r[i.pendente?'a_receber':'recebido']+=i.valor;else{d.r[i.pendente?'a_pagar':'pago']+=i.valor;cats[i.categoria]=(cats[i.categoria]||0)+i.valor}}
    if(i.mes===ant)d.anterior[i.tipo==='Receita'?'receitas':'despesas']+=i.valor;
    if(i.tipo!=='Despesa')return;
    if(i.mes>limite)fut[i.mes]=(fut[i.mes]||0)+i.valor;
    if(i.pendente&&i.data<hj){d.vencidas++;d.vencidasValor+=i.valor}
    if(i.pendente&&i.data<=lim)d.vencimentos.push(i);
  });
  // Caixa: conta pelo dia do pagamento. Sem essa data (lançamentos antigos), usa o vencimento.
  d.caixa={entrou:0,doMes:0,atrasadas:0,adiantadas:0,listaAtrasadas:[]};
  base.itens.forEach(function(i){
    if(i.pendente||(i.pagoEm||i.data).slice(0,7)!==mes)return;
    if(i.tipo==='Receita'){d.caixa.entrou+=i.valor;return}
    if(i.mes===mes)d.caixa.doMes+=i.valor;
    else if(i.mes<mes){d.caixa.atrasadas+=i.valor;d.caixa.listaAtrasadas.push(i)}
    else d.caixa.adiantadas+=i.valor;
  });
  d.caixa.pago=d.caixa.doMes+d.caixa.atrasadas+d.caixa.adiantadas;d.caixa.sobra=d.caixa.entrou-d.caixa.pago;d.caixa.listaAtrasadas.sort(porData);
  d.itens.sort(porData);d.vencimentos.sort(porData);d.vencimentos=d.vencimentos.slice(0,6);
  d.saldo=d.r.recebido-d.r.pago;d.previsto=d.saldo+d.r.a_receber-d.r.a_pagar;
  d.futuros=Object.keys(fut).sort().map(function(m){return {mes:m,valor:fut[m]}});
  d.categorias=Object.keys(cats).map(function(n){return {nome:n,valor:cats[n]}}).sort(function(a,b){return b.valor-a.valor});
  return d;
}
function somarDias(iso,n){return new Date(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10)+n)).toISOString().slice(0,10)}
function variacao(a,b){if(!b)return 'Sem base no mês anterior';var v=(a-b)/b*100;return (v>0?'▲ ':v<0?'▼ ':'')+Math.abs(v).toFixed(1).replace('.',',')+'% no total sobre o mês anterior'}

function itemHtml(i,hj,comAno){
  var feito=!i.pendente,sit;
  if(feito)sit='<span class="ok">✓ '+esc((i.status||'').toLowerCase())+(i.pagoEm?' em '+ddmm(i.pagoEm):'')+'</span>';
  else sit=i.data<hj&&i.tipo==='Despesa'?'<span class="neg">⚠ vencida</span>':(i.tipo==='Receita'?'a receber':'a pagar');
  if(i.temporario)sit+=', salvando';
  var ax=i.anexos||[],bo=ax.filter(function(a){return a.tipo==='boleto'}).length,co=ax.length-bo,rot=[];if(bo)rot.push('boleto');if(co)rot.push('comprovante');
  var par=i.parcela&&i.parcela!=='Mensal'?' ('+esc(i.parcela)+')':'';
  var dt=ddmm(i.data)+(comAno?'/'+i.data.slice(0,4):'');
  var h='<div class="item'+(feito?' feito':'')+'"'+(i.temporario?'':' data-id="'+esc(i.id)+'"')+'><div class="lin" style="padding:0"><span>'+esc(i.descricao)+par+'</span><b>'+(i.tipo==='Receita'?'+ ':'')+real(i.valor)+'</b></div><div class="sub">'+dt+', '+esc(i.categoria)+', '+sit+(String(i.origem||'').indexOf('app:')===0?', por '+esc(i.origem.slice(4)):'')+(rot.length?', <span class="clip">📎 '+rot.join(' e ')+'</span>':'')+'</div>';
  if(i.temporario)return h+'</div>';
  h+='<div class="acoes">';
  if(i.pendente)h+='<button class="forte" data-baixar="'+esc(i.id)+'">'+(i.tipo==='Receita'?'Recebi':'Paguei')+'</button>';
  return h+'<button data-editar="'+esc(i.id)+'">Editar</button><button data-excluir="'+esc(i.id)+'">Excluir</button></div></div>';
}
function grupoHtml(titulo,lista,hj,classe){
  if(!lista.length)return '';
  var t=lista.reduce(function(s,i){return s+i.valor},0),h='<section class="grupo '+classe+'"><div class="cabeca"><h3>'+titulo+' ('+lista.length+')</h3><b>'+real(t)+'</b></div>';
  lista.forEach(function(i){h+=itemHtml(i,hj,false)});
  return h+'</section>';
}

  if(emRelatorio){desenharRelatorio();mostrarStatus();return}
  $('relatorio').hidden=true;
  var d=resumo(mesAtivo),r=d.r,h='';
  $('entrada').hidden=true;$('areaBusca').hidden=false;$('tela').hidden=false;$('abrir').hidden=false;
  h+='<div class="topo"><button class="seta" data-mes="'+outroMes(d.mes,-1)+'" aria-label="Mês anterior">‹</button><h1>'+nomeMes(d.mes)+'</h1><button class="seta" data-mes="'+outroMes(d.mes,1)+'" aria-label="Próximo mês">›</button></div>';
  h+='<p class="conta"><span>Conectado como '+esc(sessao.usuario)+'</span><span style="display:flex;gap:14px;align-items:center"><button type="button" class="btnRel" data-relatorio="1">Relatório</button><button type="button" data-sair="1" class="linkbtn">Sair</button></span></p></p>';
  var cx=d.caixa;
  h+='<section class="caixa"><h3>Caixa do mês</h3><p class="sub" style="margin:0 0 6px">Pelo dia em que cada conta foi paga ou recebida</p>';
  h+='<div class="lin"><span>Entrou (receitas)</span><b class="azul">'+real(cx.entrou)+'</b></div>';
  h+='<div class="lin"><span>Pago, contas deste mês</span><b>'+real(cx.doMes)+'</b></div>';
  h+='<div class="lin"><span>Pago, contas atrasadas de meses anteriores</span><b>'+real(cx.atrasadas)+'</b></div>';
  if(cx.adiantadas)h+='<div class="lin"><span>Pago adiantado, contas de meses seguintes</span><b>'+real(cx.adiantadas)+'</b></div>';
  h+='<div class="lin total"><span>Total pago no mês</span><b class="ok">'+real(cx.pago)+'</b></div>';
  h+='<div class="lin total" style="border-bottom:1px solid var(--linha)"><span>'+(cx.sobra<0?'Faltou':'Sobrou')+'</span><b class="'+(cx.sobra<0?'neg':'')+'">'+real(Math.abs(cx.sobra))+'</b></div>';
  h+='<div class="lin total previsto"><span>Fechamento previsto</span><b class="'+(d.previsto<0?'neg':'')+'">'+real(d.previsto)+'</b></div>';
  if(cx.listaAtrasadas.length){h+='<details class="atrasadasPagas"><summary>Ver as '+cx.listaAtrasadas.length+' contas atrasadas pagas neste mês</summary>';cx.listaAtrasadas.forEach(function(i){h+='<div class="lin"><span>'+esc(i.descricao)+(i.parcela&&i.parcela!=='Mensal'?' ('+esc(i.parcela)+')':'')+' <span class="sub">venceu '+ddmm(i.data)+'/'+i.data.slice(0,4)+(i.pagoEm?', paga '+ddmm(i.pagoEm):'')+'</span></span><b>'+real(i.valor)+'</b></div>'});h+='</details>'}
  h+='</section>';
  if(d.vencidas)h+='<p class="alerta">⚠ '+d.vencidas+(d.vencidas>1?' contas vencidas':' conta vencida')+', '+real(d.vencidasValor)+'</p>';
  h+='<div class="colunas"><div>';
  var f=function(t,p){return d.itens.filter(function(i){return i.tipo===t&&i.pendente===p})};
  var grupos=grupoHtml('A pagar',f('Despesa',true),d.hoje,'')+grupoHtml('✓ Pagas',f('Despesa',false),d.hoje,'pagas')+grupoHtml('A receber',f('Receita',true),d.hoje,'')+grupoHtml('✓ Recebidas',f('Receita',false),d.hoje,'pagas');
  h+=grupos||'<section><p class="vazio">Nada lançado neste mês. Toque em Novo lançamento.</p></section>';
  h+='</div><div>';
  if(d.categorias.length){var maior=d.categorias[0].valor;h+='<section><h3>Gastos por categoria</h3>';d.categorias.slice(0,6).forEach(function(c){h+='<div class="cat"><div class="lin" style="padding:0"><span>'+esc(c.nome)+'</span><b>'+real(c.valor)+'</b></div><div class="trilho"><i style="width:'+(c.valor/maior*100).toFixed(1)+'%"></i></div></div>'});h+='</section>'}
  if(d.vencimentos.length){h+='<section><h3>Próximos vencimentos</h3>';d.vencimentos.forEach(function(v){h+='<div class="lin"><span>'+ddmm(v.data)+' '+esc(v.descricao)+(v.data<d.hoje?' <span class="neg">⚠ vencida</span>':'')+'</span><b>'+real(v.valor)+'</b></div>'});h+='</section>'}
  h+='<section><h3>Gastos futuros</h3>';
  if(!d.futuros.length)h+='<p class="vazio">Nenhuma conta lançada para os próximos meses.</p>';
  d.futuros.forEach(function(x){h+='<div class="lin"><span>'+nomeMes(x.mes)+'</span><b>'+real(x.valor)+'</b></div>'});
  h+='</section></div></div>';
  $('tela').innerHTML=h;

}
function mostrarStatus(){
  var x=$('status'),t=avisoStatus,tentar=false;
  if(!t&&fila.length)t=enviando?'Salvando...':fila.length+(fila.length>1?' alterações aguardando':' alteração aguardando')+' envio.';
  if(avisoStatus&&fila.length)tentar=true;
  x.innerHTML=t?esc(t)+(tentar?' <button type="button" class="linkbtn" id="tentar">Tentar agora</button>':''):'';
  x.hidden=!t;x.className=avisoStatus?'erro':'salvando';
  var rs=$('rlStatus');if(rs)rs.textContent=t||'';
  if(tentar)$('tentar').onclick=function(){avisoStatus='';processarFila()};
}

// Atualiza em segundo plano; a tela já mostrou o que está guardado no aparelho.
function atualizar(){
  if(fila.length||!sessao.token)return;
  var rev=revisao;
  enviar({acao:'tudo',token:sessao.token}).then(function(r){
    if(r.codigo)return pedirLogin(AVISOS[r.codigo]);
    if(!r.ok){avisoStatus=r.erro==='Operação desconhecida.'?SEM_NOVA:r.erro;semDados();return}
    if(rev!==revisao||fila.length)return;
    ultimaAtualizacao=Date.now();avisoStatus='';receber(r.itens);
  }).catch(function(){
    avisoStatus=temDados?'Sem conexão: mostrando os últimos dados guardados.':'Não consegui falar com o servidor. Verifique a internet e atualize a página.';
    semDados();
  });
}
function semDados(){if(!temDados)$('tela').innerHTML='';mostrarStatus()}
function receber(itens){var mudou=JSON.stringify(itens)!==JSON.stringify(base.itens);base.itens=itens;contarSeries();temDados=true;guardarLocal();if(mudou||$('tela').hidden||!$('tela').querySelector('.placar'))desenhar();else mostrarStatus()}

// Grava em segundo plano, um pedido por vez. Se a internet cair, nada se perde.
function operar(op){revisao++;aplicarLocal(op);fila.push(op);contarSeries();guardarLocal();avisoStatus='';desenhar();processarFila()}
function processarFila(){
  if(enviando||!fila.length||!sessao.token)return;
  enviando=true;mostrarStatus();
  enviar({acao:'op',token:sessao.token,op:fila[0]}).then(function(r){
    enviando=false;
    if(r.codigo)return pedirLogin(AVISOS[r.codigo]);
    if(!r.ok){
      if(r.erro==='Operação desconhecida.'){avisoStatus=SEM_NOVA;mostrarStatus();return}
      fila.shift();guardarLocal();avisoStatus='Não foi salvo: '+r.erro;desenhar();revisao++;if(!fila.length)atualizarDepoisDeErro();else processarFila();return;
    }
    fila.shift();
    if(fila.length){guardarLocal();processarFila();return}
    revisao++;avisoStatus=avisoStatus.indexOf('Não foi salvo')===0?avisoStatus:'';ultimaAtualizacao=Date.now();receber(r.itens);
  }).catch(function(){
    enviando=false;avisoStatus='Sem conexão: alterações guardadas neste aparelho. Serão enviadas quando a internet voltar.';mostrarStatus();
  });
}
function atualizarDepoisDeErro(){var a=avisoStatus;enviar({acao:'tudo',token:sessao.token}).then(function(r){if(r.ok&&!fila.length){receber(r.itens);avisoStatus=a;mostrarStatus()}}).catch(function(){})}

// Mesma regra do servidor, para a tela responder na hora.
function aplicarLocal(op){
  var acha=function(id){return base.itens.filter(function(i){return i.id===id})[0]};
  if(op.tipo==='baixar'){var b=acha(op.id);if(b){b.pendente=false;b.status=b.tipo==='Receita'?'Recebido':'Pago';b.pagoEm=hoje()}}
  else if(op.tipo==='excluir'){var e=acha(op.id);if(!e)return;base.itens=base.itens.filter(function(i){return op.escopo==='todos'&&e.serie?i.serie!==e.serie:i.id!==e.id})}
  else if(op.tipo==='editar'){
    var f=op.edicao,at=acha(f.id);if(!at)return;var v=centavos(f.valor),dia=+f.data.slice(8,10),base0=at.data;
    var alvos=f.escopo==='todos'&&at.serie?base.itens.filter(function(i){return i.serie===at.serie}):[at];
    alvos.forEach(function(i){var nova=i===at?f.data:somarMeses(f.data,mesesEntre(base0,i.data),dia);i.data=nova;i.mes=nova.slice(0,7);i.valor=v;i.descricao=f.descricao.trim()});
    if(alvos.length===1||f.escopo!=='todos'){if(f.situacao!=='pendente')at.pagoEm=f.pagoEm||at.pagoEm||hoje();at.pendente=f.situacao==='pendente';at.status=at.pendente?'Pendente':(at.tipo==='Receita'?'Recebido':'Pago')}
  }else if(op.tipo==='lancar'){
    var l=op.lancamento,val=centavos(l.valor),n=l.repetir==='mensal'?12:l.repetir==='parcelado'?parseInt(l.parcelas,10):1,porP=l.valorModo==='parcela',pb=l.repetir==='parcelado'&&!porP?Math.floor(val/n):val,d0=+l.data.slice(8,10);
    for(var k=0;k<n;k++){var dt=somarMeses(l.data,k,d0),pv=l.repetir==='parcelado'&&!porP&&k===0?val-pb*(n-1):pb,fe=k===0&&l.situacao==='feito';
      base.itens.push({id:novoId('t'),data:dt,mes:dt.slice(0,7),tipo:l.tipo,categoria:'Categorizando',descricao:l.descricao.trim(),valor:pv,pendente:!fe,status:fe?(l.tipo==='Receita'?'Recebido':'Pago'):'Pendente',parcela:l.repetir==='mensal'?'Mensal':l.repetir==='parcelado'&&n>1?(k+1)+'/'+n:'',origem:'app:'+sessao.usuario,serie:l.opId,pagoEm:fe?hoje():'',temporario:true})}
  }
}

var buscaTermo='';
function desenharBusca(){
  var x=$('resultados'),t=normalizar(buscaTermo).trim();
  if(t.length<2){x.hidden=true;x.innerHTML='';return}
  var partes=t.split(/\s+/),hj=hoje();
  var ach=base.itens.filter(function(i){var c=normalizar(i.descricao+' '+i.categoria+' '+(i.valor/100).toFixed(2).replace('.',',')+' '+ddmm(i.data)+'/'+i.data.slice(0,4));return partes.every(function(p){return c.indexOf(p)>=0})}).sort(porData);
  var g=0,re=0;ach.forEach(function(i){if(i.tipo==='Receita')re+=i.valor;else g+=i.valor});
  var h='<div class="lin" style="padding:0 0 6px"><h3 style="margin:0">'+ach.length+(ach.length===1?' resultado':' resultados')+' para "'+esc(buscaTermo.trim())+'"</h3><button type="button" class="linkbtn" data-limpar="1">Limpar</button></div>';
  if(g||re)h+='<div class="sub">'+(g?'Gastos: '+real(g):'')+(g&&re?', ':'')+(re?'Receitas: '+real(re):'')+'</div>';
  if(!ach.length)h+='<p class="vazio">Nenhuma conta encontrada. Tente outra palavra.</p>';
  ach.slice(0,100).forEach(function(i){h+=itemHtml(i,hj,true)});
  if(ach.length>100)h+='<p class="vazio">Mostrando as 100 primeiras. Pesquise algo mais específico para ver as demais.</p>';
  x.innerHTML=h;x.hidden=false;
}

function pedirLogin(aviso){
  sessao.token='';gravar('cm_token','');emRelatorio=false;$('relatorio').hidden=true;$('relatorio').innerHTML='';$('tela').hidden=true;$('abrir').hidden=true;$('areaBusca').hidden=true;
  ['janela','janelaEditar','janelaExcluir','janelaDetalhe'].forEach(function(j){if($(j).open)$(j).close()});
  $('entrada').hidden=false;$('caixaServidor').hidden=!!sessao.servidor;var x=$('erroSenha');x.textContent=aviso||'';x.hidden=!aviso;$('senha').value='';$('usuario').value=ler('cm_usuario');
  ($('usuario').value?$('senha'):sessao.servidor?$('usuario'):$('servidor')).focus();
}
function sair(){
  var q=fila.length?'Há alterações ainda não enviadas, que serão perdidas. Sair mesmo assim?':'Sair desta conta neste aparelho? Os dados guardados nele serão apagados.';
  if(!confirm(q))return;
  fila=[];base.itens=[];temDados=false;avisoStatus='';buscaTermo='';$('termo').value='';gravar('cm_cache','');gravar('cm_fila','');$('tela').innerHTML='';pedirLogin('');
}
function aoClicar(ev){
  var d=ev.target.dataset;
  if(d.sair)return sair();
  if(d.relatorio)return abrirRelatorio();
  if(d.mes){mesAtivo=d.mes;desenhar();window.scrollTo(0,0)}
  else if(d.baixar)operar({tipo:'baixar',id:d.baixar,quando:agora()});
  else if(d.editar)abrirEdicao(d.editar);
  else if(d.excluir)pedirExclusao(d.excluir);
  else{var it=ev.target.closest('.item[data-id]');if(it)abrirDetalhe(it.dataset.id)}
}

$('formBusca').onsubmit=function(ev){ev.preventDefault();buscaTermo=$('termo').value;desenharBusca();$('termo').blur()};

function prepararArquivo(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<500000||!window.createImageBitmap)return Promise.resolve({blob:f,mime:f.type,nome:f.name});
  return createImageBitmap(f).then(function(img){
    var e=Math.min(1,2000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*e);c.height=Math.round(img.height*e);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);if(img.close)img.close();
    return new Promise(function(ok){c.toBlob(function(b){if(b&&b.size<f.size)ok({blob:b,mime:'image/jpeg',nome:f.name.replace(/\.[^.]+$/,'')+'.jpg'});else ok({blob:f,mime:f.type,nome:f.name})},'image/jpeg',.85)});
  }).catch(function(){return {blob:f,mime:f.type,nome:f.name}});
}

var emRelatorio=false,rlMes='',rlCortes={},rlUsar=false,rlRedVar=0,rlRedEve=0;
var MES_CURTO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function mesCurto(m){return MES_CURTO[+m.slice(5,7)-1]+'/'+m.slice(2,4)}
function rlN(t){return normalizar(t||'').replace(/\s+/g,' ').trim()}
function rlNat(i){
  if(i.tipo==='Despesa'&&(RL.sempreFixos.blocos.indexOf(rlBloco(i))>=0||RL.sempreFixos.palavras.some(function(p){return rlN(i.descricao).indexOf(p)>=0})))return 'Fixo';
  return i.natureza==='Fixa'?'Fixo':i.natureza==='Variável'?'Variável':'Eventual';
}
function rlClasse(i){var n=rlNat(i);return n==='Fixo'?'rl-f':n==='Variável'?'rl-v':'rl-e'}
function rlBloco(i){
  var c=rlN(i.categoria),d=rlN(i.descricao);
  for(var k=0;k<RL.blocos.length;k++){var b=RL.blocos[k];
    if(b.categorias.some(function(x){return rlN(x)===c})||b.palavras.some(function(p){return d.indexOf(p)>=0})||b.inteiras.some(function(p){return new RegExp('\\b'+p+'\\b').test(d)}))return b.nome}
  return RL.restante;
}
function rlRecorrente(i){return RL.recorrenteCategorias.some(function(x){return rlN(x)===rlN(i.categoria)})||(i.parcela||'').trim()==='Mensal'}
function rlCompleto(m){var a=rlN(RL.categoriaMesCompleto);return base.itens.some(function(i){return i.mes===m&&i.tipo==='Receita'&&rlN(i.categoria)===a})}

function rlPct(p,t){return t?Math.round(p*1000/t)/10:null}
function rlPctTxt(v){return v===null?'sem receita':String(v.toFixed(1)).replace('.',',')+'%'}
function rlTot(m){
  var t={receita:0,recorrente:0,Fixo:0,'Variável':0,Eventual:0,aPagar:0};
  base.itens.forEach(function(i){if(i.mes!==m)return;
    if(i.tipo==='Receita'){t.receita+=i.valor;if(rlRecorrente(i))t.recorrente+=i.valor}

  // Simulador

  // Mês a mês
  var hist=rlMeses().slice(-18).map(function(x){var o=rlTot(x);o.mes=x;return o}),esc3=Math.max.apply(null,hist.map(function(o){return Math.max(o.despesas,o.receita)}).concat([1]));

  h+='</div></section>';

  // Parcelas e recorrentes em aberto
  var gr={};base.itens.forEach(function(i){var p=(i.parcela||'').trim();if(i.tipo!=='Despesa'||!(p==='Mensal'||/^\d+\s*\/\s*\d+$/.test(p)))return;var k=i.serie||rlN(i.descricao)+'|'+p.split('/').pop();(gr[k]=gr[k]||[]).push(i)});
  var par=[];Object.keys(gr).forEach(function(k){var l=gr[k],pe=l.filter(function(i){return i.pendente}).sort(porData);if(!pe.length)return;var mensal=(l[0].parcela||'').trim()==='Mensal';
    par.push({d:l[0].descricao,tipo:mensal?'Mensal':'Parcelado',nat:rlNat(l[0]),vm:pe[0].valor,f:pe.length,tot:pe.reduce(function(s,i){return s+i.valor},0),fim:l.reduce(function(s,i){return i.mes>s?i.mes:s},'')})});

  var ven=base.itens.filter(function(i){return i.tipo==='Despesa'&&i.pendente&&i.data<hj}).sort(porData),vt=ven.reduce(function(s,i){return s+i.valor},0),dh=Date.UTC(+hj.slice(0,4),+hj.slice(5,7)-1,+hj.slice(8,10));

  if(ven.length){h+='<div class="rl-rol"><table class="rl-tab"><tr><th>Vencimento</th><th>Descrição</th><th>Competência</th><th class="n">Valor</th><th class="n">Dias de atraso</th></tr>';ven.forEach(function(i){var di=Math.round((dh-Date.UTC(+i.data.slice(0,4),+i.data.slice(5,7)-1,+i.data.slice(8,10)))/86400000);h+='<tr><td>'+ddmm(i.data)+'/'+i.data.slice(0,4)+'</td><td>'+rlNome(i)+'</td><td>'+mesCurto(i.mes)+'</td><td class="n">'+real(i.valor)+'</td><td class="n">'+di+'</td></tr>'});h+='</table></div>'}

function rlSimular(saldo,gastos){
  var q=0,mv=0,eco=0;
  gastos.forEach(function(i){if(rlCortes[i.id]){q++;mv+=i.valor;if(rlUsar){eco+=i.valor;return}}if(rlNat(i)==='Variável')eco+=i.valor*rlRedVar/100;else if(rlNat(i)==='Eventual')eco+=i.valor*rlRedEve/100});

}
$('relatorio').onclick=function(ev){
  var el=ev.target.closest('[data-rlid],[data-rlmes],[data-rlvoltar],[data-rllimpar],[data-rllimparsel],[data-rlgrp],[data-rllado]');if(!el)return;var d=el.dataset;

    var ids=[];el.parentElement.querySelectorAll('.rl-it[data-rlid]').forEach(function(e){if(ids.indexOf(e.dataset.rlid)<0)ids.push(e.dataset.rlid)});
    if(!ids.length)return;var todos=ids.every(function(id){return rlCortes[id]});
    ids.forEach(function(id){rlCortes[id]=!todos;document.querySelectorAll('.rl-it[data-rlid="'+id.replace(/"/g,'')+'"]').forEach(function(e){e.classList.toggle('rl-sel',!todos);e.setAttribute('aria-pressed',!todos)})});
    rlSimular(rlTot(rlMes).saldo,base.itens.filter(function(i){return i.mes===rlMes&&i.tipo==='Despesa'}));return}
  if(d.rlvoltar)return fecharRelatorio();
  if(d.rlmes){rlMes=d.rlmes;rlCortes={};rlUsar=false;rlRedVar=0;rlRedEve=0;desenharRelatorio();window.scrollTo(0,0);return}
  if(d.rllimpar){rlUsar=false;rlRedVar=0;rlRedEve=0;desenharRelatorio();return}
  if(d.rlid){rlCortes[d.rlid]=!rlCortes[d.rlid];var on=!!rlCortes[d.rlid];document.querySelectorAll('.rl-it[data-rlid="'+d.rlid.replace(/"/g,'')+'"]').forEach(function(e){e.classList.toggle('rl-sel',on);e.setAttribute('aria-pressed',on)});
    var g=base.itens.filter(function(i){return i.mes===rlMes&&i.tipo==='Despesa'});rlSimular(rlTot(rlMes).saldo,g)}
};
$('relatorio').onkeydown=function(ev){var dd=ev.target.dataset||{};if((ev.key==='Enter'||ev.key===' ')&&(dd.rlid||dd.rlgrp||dd.rllado)){ev.preventDefault();ev.target.click()}};

function iniciarTela(){
  mesAtivo=mesAtivo||hoje().slice(0,7);
  if(location.hash==='#relatorio'&&!emRelatorio){emRelatorio=true;rlMes=rlPadrao()}
  $('entrada').hidden=true;$('areaBusca').hidden=false;$('tela').hidden=false;$('abrir').hidden=false;
  if(temDados)desenhar();else if(!avisoStatus)$('tela').innerHTML='<p class="vazio">Carregando pela primeira vez...</p>';
  if(fila.length)processarFila();else atualizar();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&sessao.token&&Date.now()-ultimaAtualizacao>60000){if(fila.length)processarFila();else atualizar()}});
window.addEventListener('online',function(){if(sessao.token){avisoStatus='';if(fila.length)processarFila();else atualizar()}});
setInterval(function(){if(fila.length&&!enviando&&sessao.token&&navigator.onLine!==false)processarFila()},30000);
if('serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
sessao.servidor=ler('cm_servidor');sessao.token=ler('cm_token');sessao.usuario=ler('cm_usuario');
try{var c=JSON.parse(ler('cm_cache')||'null');if(c&&c.itens){base.itens=c.itens;temDados=true}fila=JSON.parse(ler('cm_fila')||'[]');contarSeries()}catch(e){fila=[]}
